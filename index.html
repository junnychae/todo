<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>할 일</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✅</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="app-header">
      <div>
        <h1>할 일</h1>
        <p class="today" id="today"></p>
      </div>
      <div class="progress" id="progress" hidden>
        <span class="progress-text" id="progress-text"></span>
        <div class="progress-bar" id="progress-bar" role="progressbar" aria-label="완료율"
             aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <span id="progress-fill"></span>
        </div>
      </div>
    </header>

    <form class="new-todo" id="new-todo-form" autocomplete="off">
      <button type="button" class="toggle-all is-hidden" id="toggle-all" aria-pressed="false" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M18 6 7 17l-5-5"/><path d="m22 10-7.5 7.5L13 16"/></svg>
      </button>
      <label class="visually-hidden" for="new-todo">새 할 일</label>
      <input id="new-todo" class="new-todo-input" type="text" placeholder="무엇을 해야 하나요?" maxlength="200" autofocus>
      <button type="submit" class="add-button">추가</button>
    </form>

    <ul class="todo-list" id="todo-list" aria-label="할 일 목록"></ul>
    <p class="empty" id="empty"></p>

    <footer class="app-footer" id="footer" hidden>
      <span class="count" id="count" aria-live="polite"></span>
      <nav class="filters" aria-label="보기 필터">
        <a href="#/" data-filter="all">전체</a>
        <a href="#/active" data-filter="active">진행 중</a>
        <a href="#/completed" data-filter="completed">완료</a>
      </nav>
      <button type="button" class="clear-completed" id="clear-completed">완료 항목 삭제</button>
    </footer>
  </main>

  <p class="hint">더블클릭으로 수정 · Enter 저장 · Esc 취소 · Ctrl+Z 삭제 취소</p>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden>
    <span id="toast-message"></span>
    <button type="button" id="toast-undo">실행 취소</button>
  </div>

  <template id="todo-template">
    <li class="todo-item">
      <label class="check">
        <input type="checkbox" class="toggle">
        <span class="checkmark" aria-hidden="true"></span>
      </label>
      <span class="title"></span>
      <input class="edit" type="text" maxlength="200" aria-label="할 일 수정" hidden>
      <div class="actions">
        <button type="button" class="icon-button edit-button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        </button>
        <button type="button" class="icon-button delete-button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="m19 6-1 14H6L5 6"/></svg>
        </button>
      </div>
    </li>
  </template>

  <script src="app.js"></script>
</body>
</html>
